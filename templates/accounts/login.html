{% load static %}

<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Login | INVENTIQ</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}?v=brand-dark-871F09"
    >

</head>


<body class="auth-page">


<div class="login-container">

    <div class="login-card">


        <!-- =========================
             BRAND
        ========================== -->

        <div class="login-brand">

            <div class="login-logo-wrap">

                <img
                    src="{% static 'images/w-letter-mark.png' %}"
                    alt="Waxi's W Mark"
                    class="login-logo-image"
                >

            </div>


            <h1>INVENTIQ</h1>

            <p>
                Smart Inventory Management System
            </p>

        </div>


        <!-- =========================
             MESSAGES
        ========================== -->

        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-danger login-alert">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <!-- =========================
             LOGIN FORM
        ========================== -->

        <form
            method="POST"
            novalidate
        >

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <div class="input-wrap">

                    <i class="bi bi-person"></i>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                        autofocus
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrap">

                    <i class="bi bi-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button"
            >

                <span>
                    Sign In
                </span>

                <i class="bi bi-arrow-right"></i>

            </button>

        </form>


        <!-- FOOTER -->

        <p class="login-footer">

            <i class="bi bi-shield-check"></i>

            Secure access to your INVENTIQ workspace

        </p>


    </div>

</div>


</body>

</html>
